version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: prueba_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: world
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./world.sql:/docker-entrypoint-initdb.d/world.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: prueba_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    build: .
    container_name: prueba_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  db_data: